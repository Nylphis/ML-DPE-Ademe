# Mise à jour des données DPE et réentraînement à la demande, hors de Render.
#
# - Automatique, le 1er de chaque mois : mise à jour incrémentale, sans réentraînement.
# - Manuel (onglet Actions > Run workflow, ou page Administration de l'appli) :
#   options reconstruction complète et réentraînement.
# Fichiers modifiés commités sur la branche lancée (main) ; Render redéploie ensuite.
# Droit d'écriture accordé par le bloc permissions ci-dessous.

name: Mise à jour des données

on:
  schedule:
    - cron: "0 3 1 * *"   # 1er du mois, 3 h UTC
  workflow_dispatch:
    inputs:
      complet:
        description: "Reconstruction complète (retélécharge tout, environ 12 min)"
        type: boolean
        default: false
      reentrainer:
        description: "Réentraîner les modèles"
        type: boolean
        default: false

# Une mise à jour à la fois ; nouvelle demande en attente de la précédente
concurrency:
  group: mise-a-jour-donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # github.event.inputs : texte ("true"/"false"), quel que soit le mode de lancement.
      # Lancement automatique : vide -> mise à jour incrémentale.
      - name: Récupérer et nettoyer les données
        env:
          COMPLET: ${{ github.event.inputs.complet }}
        run: |
          if [ "$COMPLET" = "true" ]; then
            python run.py fetch clean --refetch
          else
            python run.py fetch clean --incremental
          fi

      - name: Réentraîner les modèles
        if: ${{ github.event.inputs.reentrainer == 'true' }}
        run: python run.py train

      - name: Publier les fichiers modifiés
        run: |
          git add data/processed models
          if git diff --cached --quiet; then
            echo "Aucun changement : rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour automatique des données DPE"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
